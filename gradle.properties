# Gradle performance
org.gradle.jvmargs=-Xmx8192M
org.gradle.vfs.watch=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.warning.mode=all

# Mod properties
# NOTE (ucfix 2026-10-04): version carries the fix-pack marker + beta suffix so fork
# builds are distinguishable in the mod list from upstream's plain 0.95.56 release.
# ucfix2: lazy nav look (ported baritone-26.3 legit camera) + short/twisty route no-hop.
mod_version=0.95.56-ucfix2-beta
# NOTE (audit fix 2026-10-04): minecraft_version / yarn_mappings / fabric_api_version below
# are LEGACY — nothing in build.gradle, root.gradle.kts or tungsten/build.gradle reads them.
# Real per-version mappings/fabric-api pins live in build.gradle (mappingsVersions /
# fabricApiVersions maps); the active default version lives in root.gradle.kts (defaultVersion).
minecraft_version=1.21.1
loader_version=0.16.7
yarn_mappings=1.21.1+build.3
fabric_api_version=0.116.9+1.21.1

maven_group=dev.unionclef
archives_base_name=unionclef
